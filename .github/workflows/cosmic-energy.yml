name: Cosmic Energy

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cosmic-energy]

permissions:
  contents: read

concurrency:
  group: cosmic-energy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline one-line kernel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-line size, invariants, and Omega limit
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < Cosmic_Energy.sh)" -eq 1
          test "$(wc -c < Cosmic_Energy.sh)" -lt 2048
          sh Cosmic_Energy.sh 8 | tee offline.jsonl
          python3 - <<'PY'
          import json
          a=[json.loads(x) for x in open('offline.jsonl') if x.strip()]
          assert len(a)==8
          assert all(x.get('SPEC_OK') is True for x in a)
          assert all(x.get('x_n',0)>1 and x.get('x_O')==1 for x in a)
          print('PASS: finite x_n>1 with Omega unit limit x_O=1')
          PY

  live:
    name: Live self-inclusive verifier
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run live mode from same file
        shell: bash
        run: |
          set -euo pipefail
          sh Cosmic_Energy.sh live letsgo0226 | tee live.json
          python3 - <<'PY'
          import json
          x=json.load(open('live.json'))
          assert x.get('CORPUS_OK') is True
          assert x.get('SELF') is True and x.get('WORKFLOW') is True
          assert x.get('REV') is True and x.get('T') is False and x.get('E')==0
          print('PASS: live self-inclusive corpus')
          PY
          {
            echo '## Cosmic Energy'
            echo '- Trigger: `${{ github.event_name }}`'
            echo '- Runtime: one `Cosmic_Energy.sh`'
            echo '- Offline: `<2048 bytes`, one physical line, `x_n>1 -> x_O=1`, PASS'
            echo '- Live: public GitHub corpus + self + workflow, PASS'
            echo '```json'
            cat live.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
