name: Cosmic Energy

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cosmic-energy]

permissions:
  contents: read

concurrency:
  group: cosmic-energy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline invariant kernel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline mode
        shell: bash
        run: |
          set -euo pipefail
          sh Cosmic_Energy.sh offline 8 | tee cosmic_energy_offline.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('cosmic_energy_offline.jsonl',encoding='utf-8') if x.strip()]
          assert rows and rows[0].get('MODEL')=='OFFLINE_OMEGA_KERNEL'
          assert len(rows[1:])==8
          assert all(x.get('SPEC_OK') is True for x in rows[1:])
          print('PASS: offline invariants closed')
          PY

  live:
    name: Live self-inclusive GitHub verifier
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run live mode from the same program
        shell: bash
        run: |
          set -euo pipefail
          sh Cosmic_Energy.sh live letsgo0226 | tee cosmic_energy_live.json
          python3 - <<'PY'
          import json
          x=json.load(open('cosmic_energy_live.json',encoding='utf-8'))
          assert x.get('MODEL')=='COSMIC_ENERGY_LIVE_SELF_REFERENTIAL'
          assert x.get('CORPUS_OK') is True
          assert x.get('MANIFEST_REV') is True
          assert x.get('SELF_REV') is True
          assert x.get('WORKFLOW_REV') is True
          assert x.get('SYSTEM_REV') is True
          assert x.get('SELF_IN_PUBLIC_MANIFEST') is True
          assert x.get('WORKFLOW_IN_PUBLIC_MANIFEST') is True
          assert x.get('SELF_REMOTE_MATCH') is True
          assert x.get('WORKFLOW_REMOTE_MATCH') is True
          assert x.get('PROGRAM_IN_SYSTEM_BYTES') is True
          assert x.get('TRUNCATED') is False
          assert not x.get('ERRORS')
          assert x.get('REMOTE_ERROR') is None
          print('PASS: unified live self-inclusive certificate closed')
          PY
          {
            echo '## Cosmic Energy'
            echo
            echo '- Trigger: `${{ github.event_name }}`'
            echo '- Runtime file: `Cosmic_Energy.sh`'
            echo '- Offline mode: `PASS`'
            echo '- Live self-inclusive mode: `PASS`'
            echo '- Schedule: every 5 minutes (GitHub cron)'
            echo
            echo '```json'
            cat cosmic_energy_live.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
