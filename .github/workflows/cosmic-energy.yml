name: Cosmic Energy

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cosmic-energy]

permissions:
  contents: read

concurrency:
  group: cosmic-energy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline invariant kernel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-line offline kernel
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < Cosmic_Energy.sh)
          lines=$(wc -l < Cosmic_Energy.sh)
          echo "Kernel bytes: $bytes"
          echo "Kernel physical lines: $lines"
          test "$bytes" -lt 2048
          test "$lines" -eq 1
      - name: Run offline kernel
        shell: bash
        run: |
          set -euo pipefail
          sh Cosmic_Energy.sh 8 | tee cosmic_energy_offline.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('cosmic_energy_offline.jsonl',encoding='utf-8') if x.strip()]
          assert rows and rows[0].get('MODEL')=='OFFLINE_OMEGA_KERNEL'
          assert len(rows[1:])==8
          assert all(x.get('SPEC_OK') is True for x in rows[1:])
          print('PASS: offline invariants closed')
          PY

  live:
    name: Live GitHub corpus verifier
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live public corpus
        shell: bash
        run: |
          set -euo pipefail
          sh Cosmic_Energy_Live.sh letsgo0226 | tee cosmic_energy_live.json
          python3 - <<'PY'
          import json
          x=json.load(open('cosmic_energy_live.json',encoding='utf-8'))
          assert x.get('MODEL')=='COSMIC_ENERGY_LIVE_GITHUB'
          assert x.get('CORPUS_OK') is True
          assert x.get('REV') is True
          assert x.get('TRUNCATED') is False
          assert not x.get('ERRORS')
          print('PASS: live GitHub corpus manifest verified')
          PY
          {
            echo '## Cosmic Energy'
            echo
            echo '- Trigger: `${{ github.event_name }}`'
            echo '- Offline kernel: `PASS`'
            echo '- Live corpus: `PASS`'
            echo '- Owner: `letsgo0226`'
            echo
            echo '```json'
            cat cosmic_energy_live.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
